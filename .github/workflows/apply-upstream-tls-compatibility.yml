name: Apply upstream TLS compatibility

on:
  push:
    branches:
      - agent/upstream-tls-compatibility
    paths:
      - scripts/apply_upstream_tls_compatibility.py
      - .github/workflows/apply-upstream-tls-compatibility.yml

permissions:
  contents: write

concurrency:
  group: apply-upstream-tls-compatibility
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/upstream-tls-compatibility

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Apply deterministic patch
        run: python3 scripts/apply_upstream_tls_compatibility.py

      - name: Restore
        run: dotnet restore CaddyUi.slnx

      - name: Format
        run: dotnet format CaddyUi.slnx --no-restore

      - name: Build
        run: dotnet build CaddyUi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CaddyUi.slnx --configuration Release --no-build --no-restore

      - name: Remove temporary patch files
        run: rm scripts/apply_upstream_tls_compatibility.py .github/workflows/apply-upstream-tls-compatibility.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: support trusted self-signed HTTPS upstreams"
          git push origin HEAD:agent/upstream-tls-compatibility
