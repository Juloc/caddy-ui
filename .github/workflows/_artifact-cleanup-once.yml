name: Cleanup old Actions artifacts once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_artifact-cleanup-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest artifact and delete older artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.created_at, (.id|tostring), .name] | @tsv' | sort -r)
          if (( ${#artifacts[@]} <= 1 )); then echo "Nothing to delete; artifact count: ${#artifacts[@]}"; exit 0; fi
          echo "Keeping newest artifact: ${artifacts[0]}"
          deleted=0
          for row in "${artifacts[@]:1}"; do
            id="$(cut -f2 <<<"$row")"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            deleted=$((deleted + 1))
          done
          echo "Deleted ${deleted} old artifact(s)."
