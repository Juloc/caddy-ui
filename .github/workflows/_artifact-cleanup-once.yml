name: Cleanup old Actions artifacts once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_artifact-cleanup-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep newest artifact and delete older artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.created_at, (.id|tostring), .name] | @tsv' | sort -r)
          if (( ${#artifacts[@]} <= 1 )); then echo "Nothing to delete; artifact count: ${#artifacts[@]}"; exit 0; fi
          echo "Keeping newest artifact: ${artifacts[0]}"
          printf '%s\n' "${artifacts[@]:1}" | cut -f2 | xargs -r -P20 -I{} bash -c 'gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}" >/dev/null 2>&1 || true'
          remaining="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=1" --jq '.total_count')"
          echo "Artifact count after cleanup: ${remaining}"
          test "$remaining" -le 1
