name: Verify .NET rebuild

on:
  pull_request:
    paths:
      - ".github/workflows/dotnet-phase1.yml"
      - "CaddyUi.slnx"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "Dockerfile.dotnet"
      - "global.json"
      - "scripts/dotnet-entrypoint.sh"
      - "src/**"
      - "tests/CaddyUi.*/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/dotnet-phase1.yml"
      - "CaddyUi.slnx"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "Dockerfile.dotnet"
      - "global.json"
      - "scripts/dotnet-entrypoint.sh"
      - "src/**"
      - "tests/CaddyUi.*/**"

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore
        run: dotnet restore CaddyUi.slnx
      - name: Capture canonical formatting
        shell: bash
        run: |
          set +e
          dotnet format CaddyUi.slnx --no-restore --verbosity diagnostic > /tmp/dotnet-format.log 2>&1
          format_status=$?
          set -e
          git diff --binary > /tmp/dotnet-format.patch
          git checkout -- .
          printf '%s\n' "$format_status" > /tmp/dotnet-format.status
      - name: Build
        run: dotnet build CaddyUi.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test CaddyUi.slnx --configuration Release --no-build --logger "console;verbosity=normal"
      - name: Upload formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-format-diagnostics
          path: |
            /tmp/dotnet-format.log
            /tmp/dotnet-format.patch
            /tmp/dotnet-format.status
          retention-days: 1
      - name: Verify formatting
        shell: bash
        run: |
          test "$(cat /tmp/dotnet-format.status)" = "0"
          test ! -s /tmp/dotnet-format.patch

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dotnet-companion, dotnet-bundle]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Install SQLite test utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sqlite3
      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dotnet
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: caddy-ui:${{ matrix.target }}-phase3
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start PostgreSQL and Caddy UI
        shell: bash
        run: |
          set -euo pipefail
          docker network create caddy-ui-phase3
          docker run -d \
            --name caddy-ui-postgres \
            --network caddy-ui-phase3 \
            -e POSTGRES_DB=caddy_ui \
            -e POSTGRES_USER=caddy_ui \
            -e POSTGRES_PASSWORD=caddy_ui \
            postgres:17-alpine
          for attempt in {1..30}; do
            if docker exec caddy-ui-postgres pg_isready -U caddy_ui -d caddy_ui; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs caddy-ui-postgres
              exit 1
            fi
            sleep 1
          done
          docker run -d \
            --name caddy-ui-web \
            --network caddy-ui-phase3 \
            -p 18098:8098 \
            -p 18099:8099 \
            -e 'ConnectionStrings__CaddyUi=Host=caddy-ui-postgres;Port=5432;Database=caddy_ui;Username=caddy_ui;Password=caddy_ui' \
            -e Database__ApplyMigrationsOnStartup=true \
            -e CADDY_UI_USERNAME=ci-admin \
            -e CADDY_UI_PASSWORD=ci-admin-password-123456789 \
            -e CADDY_UI_COOKIE_NAMESPACE=caddy_ui_ci \
            -e CADDY_UI_PORTAL_PROXY_SECRET=portal-smoke-secret \
            caddy-ui:${{ matrix.target }}-phase3 web
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18098/health/ready >/tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          docker logs caddy-ui-web
          exit 1
      - name: Verify HTTP surfaces and login
        shell: bash
        run: |
          set -euo pipefail
          base_url=http://127.0.0.1:18098
          curl --fail --silent "$base_url/health/live"
          for attempt in {1..30}; do
            user_count="$(docker exec caddy-ui-postgres psql -U caddy_ui -d caddy_ui -Atc \
              "SELECT COUNT(*) FROM caddy_ui.users WHERE lower(username) = 'ci-admin';" 2>/dev/null || true)"
            if [ "$user_count" = "1" ]; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs caddy-ui-web
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            --cookie-jar /tmp/login.cookies \
            "$base_url/Login" > /tmp/login.html
          login_token="$(sed -nE 's/.*name="__RequestVerificationToken"[^>]*value="([^"]+)".*/\1/p' /tmp/login.html | head -n1)"
          test -n "$login_token"
          login_status="$(curl --silent --show-error \
            --header "Origin: ${base_url}" \
            --cookie /tmp/login.cookies \
            --cookie-jar /tmp/login.cookies \
            --dump-header /tmp/login.headers \
            --output /tmp/login.response \
            --write-out '%{http_code}' \
            --data-urlencode "__RequestVerificationToken=${login_token}" \
            --data-urlencode 'Input.Username=ci-admin' \
            --data-urlencode 'Input.Password=ci-admin-password-123456789' \
            --data-urlencode 'Input.SecondFactor=' \
            --data-urlencode 'ReturnUrl=/' \
            "$base_url/Login")"
          if [ "$login_status" != "302" ]; then
            printf 'Unexpected login status: %s\n' "$login_status"
            cat /tmp/login.headers
            cat /tmp/login.response
            docker logs caddy-ui-web
            exit 1
          fi
          grep -F 'caddy_ui_ci_admin' /tmp/login.cookies

          check_page() {
            path="$1"
            marker="$2"
            timeout="${3:-15}"
            output="/tmp/page-$(printf '%s' "$path" | tr '/?' '--').html"
            status="$(curl --max-time "$timeout" --silent --show-error \
              --cookie /tmp/login.cookies \
              --output "$output" \
              --write-out '%{http_code}' \
              "$base_url$path")"
            if [ "$status" != "200" ]; then
              printf 'Unexpected status %s for %s\n' "$status" "$path"
              cat "$output"
              docker logs caddy-ui-web
              exit 1
            fi
            grep -F "$marker" "$output"
          }

          check_page / 'Caddy UI'
          check_page /Requests '<h1>Requests</h1>'
          check_page /Access '<h1>Zugriffsgruppen</h1>'
          check_page /LiveLog '<h1>Live-Log</h1>'
          check_page /Operations/Cutover '<h1>Produktionsprüfung</h1>' 5
          check_page /Administration/Providers '<h1>DNS-Provider</h1>'
          check_page /Setup '<h1>DNS, Domain und Route einrichten</h1>'

          portal_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'X-Caddy-Portal-Secret: portal-smoke-secret' \
            -H 'X-Forwarded-Proto: https' \
            -H 'X-Forwarded-Host: app.example.com' \
            http://127.0.0.1:18099/favicon.ico)"
          test "$portal_status" = "404"
      - name: Verify SQLite migration CLI
        if: matrix.target == 'dotnet-companion'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/caddy-ui-migration
          sqlite3 /tmp/caddy-ui-migration/legacy.db <<'SQL'
          PRAGMA user_version=2;
          CREATE TABLE users(
              id TEXT PRIMARY KEY,
              username TEXT NOT NULL,
              display_name TEXT NOT NULL,
              password_hash TEXT NOT NULL,
              role TEXT NOT NULL,
              enabled INTEGER NOT NULL,
              totp_secret TEXT NOT NULL,
              totp_enabled INTEGER NOT NULL,
              theme TEXT NOT NULL,
              created_at TEXT NOT NULL,
              updated_at TEXT NOT NULL,
              last_login_at TEXT
          );
          INSERT INTO users VALUES(
              '11111111-1111-1111-1111-111111111111',
              'admin',
              'Administrator',
              'legacy-hash',
              'admin',
              1,
              '',
              0,
              'system',
              '2026-07-27T00:00:00+00:00',
              '2026-07-27T00:00:00+00:00',
              NULL
          );
          SQL
          docker run --rm \
            --network caddy-ui-phase3 \
            -v /tmp/caddy-ui-migration:/migration \
            -e 'ConnectionStrings__CaddyUi=Host=caddy-ui-postgres;Port=5432;Database=caddy_ui;Username=caddy_ui;Password=caddy_ui' \
            caddy-ui:dotnet-companion-phase3 \
            migrate import \
              --source /migration/legacy.db \
              --backup-dir /migration/backups \
              --report /migration/import.json
          test "$(jq -r '.status' /tmp/caddy-ui-migration/import.json)" = "succeeded"
          test "$(jq -r '.tables[0].sourceRows' /tmp/caddy-ui-migration/import.json)" = "1"
      - name: Verify bundled Caddy module
        if: matrix.target == 'dotnet-bundle'
        run: |
          docker run --rm \
            caddy-ui:dotnet-bundle-phase3 \
            caddy list-modules \
            | grep -F 'http.handlers.caddy_ui_guard'
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p /tmp/caddy-ui-container-logs
          docker logs caddy-ui-postgres > /tmp/caddy-ui-container-logs/postgres.log 2>&1 || true
          docker logs caddy-ui-web > /tmp/caddy-ui-container-logs/web.log 2>&1 || true
          cp /tmp/login.headers /tmp/login.response /tmp/page-*.html /tmp/caddy-ui-container-logs/ 2>/dev/null || true
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-logs-${{ matrix.target }}
          path: /tmp/caddy-ui-container-logs
          retention-days: 1
      - name: Cleanup
        if: always()
        run: |
          docker rm -f caddy-ui-web caddy-ui-postgres || true
          docker network rm caddy-ui-phase3 || true
