name: Apply wildcard certificate fix v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-wildcard-certificate-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.DOCKER_REPO_TOKEN != '' && secrets.DOCKER_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              value = target.read_text(encoding="utf-8")
              if old not in value:
                  raise SystemExit(f"Expected source block not found in {path}: {old[:80]!r}")
              target.write_text(value.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace(
              "caddy_ui/domain.py",
              dedent("""\
              class RouteKind(StrEnum):
                  PROXY = "proxy"
                  REDIRECT = "redirect"
                  CUSTOM = "custom"


              class Permission(StrEnum):
              """),
              dedent("""\
              class RouteKind(StrEnum):
                  PROXY = "proxy"
                  REDIRECT = "redirect"
                  CUSTOM = "custom"


              class CertificateMode(StrEnum):
                  WILDCARD = "wildcard"
                  INDIVIDUAL = "individual"


              class Permission(StrEnum):
              """),
          )
          replace(
              "caddy_ui/domain.py",
              "    tls_skip_verify: bool = False\n    redirect_to: str = \"\"",
              "    tls_skip_verify: bool = False\n    certificate_mode: CertificateMode = CertificateMode.WILDCARD\n    redirect_to: str = \"\"",
          )
          replace(
              "caddy_ui/domain.py",
              "        data[\"kind\"] = RouteKind(data.get(\"kind\", RouteKind.PROXY))\n        data[\"upstreams\"] = [Upstream(**item) for item in data.get(\"upstreams\", [])]",
              "        data[\"kind\"] = RouteKind(data.get(\"kind\", RouteKind.PROXY))\n        data[\"certificate_mode\"] = CertificateMode(data.get(\"certificate_mode\", CertificateMode.WILDCARD))\n        data[\"upstreams\"] = [Upstream(**item) for item in data.get(\"upstreams\", [])]",
          )

          replace(
              "caddy_ui/web.py",
              "from .domain import AccessGroup, HeaderOperation, ManagedRoute, Permission, Role, RouteKind, Upstream",
              "from .domain import AccessGroup, CertificateMode, HeaderOperation, ManagedRoute, Permission, Role, RouteKind, Upstream",
          )
          replace(
              "caddy_ui/web.py",
              "        tls_skip_verify=first(form, \"tls_skip_verify\") == \"1\",\n        redirect_to=first(form, \"redirect_to\").strip(),",
              "        tls_skip_verify=first(form, \"tls_skip_verify\") == \"1\",\n        certificate_mode=CertificateMode(first(form, \"certificate_mode\", CertificateMode.WILDCARD.value)),\n        redirect_to=first(form, \"redirect_to\").strip(),",
          )

          replace(
              "caddy_ui/views.py",
              "from .domain import AccessGroup, ManagedRoute, Role, RouteKind",
              "from .domain import AccessGroup, CertificateMode, ManagedRoute, Role, RouteKind",
          )
          replace(
              "caddy_ui/views.py",
              "        <label>Access group<select name=\"access_group_id\">{group_options}</select></label>\n        <label class=\"check\"><input name=\"tls_skip_verify\" type=\"checkbox\" value=\"1\" {'checked' if route.tls_skip_verify else ''}>Skip upstream TLS verification</label>",
              "        <label>Access group<select name=\"access_group_id\">{group_options}</select></label>\n        <label>Certificate<select name=\"certificate_mode\">{''.join(f'<option value=\"{mode.value}\" {\"selected\" if route.certificate_mode == mode else \"\"}>{\"Wildcard (default)\" if mode == CertificateMode.WILDCARD else \"Individual certificate\"}</option>' for mode in CertificateMode)}</select></label>\n        <label class=\"check\"><input name=\"tls_skip_verify\" type=\"checkbox\" value=\"1\" {'checked' if route.tls_skip_verify else ''}>Skip upstream TLS verification</label>",
          )

          replace(
              "caddy_ui/caddy.py",
              "from .domain import HeaderOperation, ManagedRoute, RouteKind",
              "from .domain import CertificateMode, HeaderOperation, ManagedRoute, RouteKind",
          )
          helpers = dedent("""\


          def _netcup_tls_lines(provider: dict[str, object], force_automate: bool = False) -> list[str]:
              lines = [
                  "dns netcup {",
                  f"    customer_number {provider.get('customer_number', '{env.NETCUP_CUSTOMER_NUMBER}')}",
                  f"    api_key {provider.get('api_key', '{env.NETCUP_API_KEY}')}",
                  f"    api_password {provider.get('api_password', '{env.NETCUP_API_PASSWORD}')}",
                  "}",
                  "propagation_timeout 600s",
                  "resolvers 1.1.1.1 8.8.8.8",
              ]
              if force_automate:
                  lines.append("force_automate")
              return lines


          def _wildcard_covers(host: str, domain: str) -> bool:
              host = host.lower().rstrip(".")
              domain = domain.lower().rstrip(".")
              return host.endswith(f".{domain}") and len(host.split(".")) == len(domain.split(".")) + 1


          def render_wildcard_site(domain: str, tls_lines: list[str]) -> str:
              lines = [
                  MANAGED_HEADER,
                  f"*.{domain} {{",
                  "    tls {",
                  *[f"        {line}" for line in tls_lines],
                  "    }",
                  "    abort",
                  "}",
                  "",
              ]
              return "\\n".join(lines)
          """)
          replace(
              "caddy_ui/caddy.py",
              "    return \"\\n\".join(lines)\n\n\nclass CaddyManager:",
              "    return \"\\n\".join(lines)" + helpers + "\n\nclass CaddyManager:",
          )

          old_rendered = indent(dedent("""\
          def _rendered_for(self, routes: list[ManagedRoute]) -> dict[str, str]:
              grouped: dict[str, list[ManagedRoute]] = {}
              for route in routes:
                  grouped.setdefault(route.effective_host, []).append(route)
              content: dict[str, str] = {}
              providers = self.providers.list()
              for host, routes in sorted(grouped.items()):
                  enabled = [route for route in routes if route.enabled]
                  catch_all = [route for route in enabled if not route.paths]
                  if len(catch_all) > 1:
                      names = ", ".join(sorted(route.name for route in catch_all))
                      raise ValueError(f"Host {host} has multiple catch-all routes: {names}.")
                  claimed_paths: dict[str, str] = {}
                  for route in enabled:
                      for path in route.paths:
                          if path in claimed_paths:
                              raise ValueError(f"Path {path} on {host} is used by both {claimed_paths[path]} and {route.name}.")
                          claimed_paths[path] = route.name
                  routes = sorted(routes, key=lambda route: (not bool(route.paths), -max((len(path) for path in route.paths), default=0), route.name.lower()))
                  tls_lines: list[str] = []
                  domain = routes[0].domain
                  provider = next((item for item in providers if domain in item.get("domains", []) and item.get("type") == "netcup"), None)
                  if provider:
                      tls_lines = [
                          "dns netcup {",
                          f"    customer_number {provider.get('customer_number', '{env.NETCUP_CUSTOMER_NUMBER}')}",
                          f"    api_key {provider.get('api_key', '{env.NETCUP_API_KEY}')}",
                          f"    api_password {provider.get('api_password', '{env.NETCUP_API_PASSWORD}')}",
                          "}",
                          "propagation_timeout 600s",
                          "resolvers 1.1.1.1 8.8.8.8",
                      ]
                  digest = hashlib.sha256(host.encode("utf-8")).hexdigest()[:12]
                  content[f"site-{digest}.caddy"] = render_site(host, routes, tls_lines)
              return content
          """), "    ")

          new_rendered = indent(dedent("""\
          def _rendered_for(self, routes: list[ManagedRoute]) -> dict[str, str]:
              grouped: dict[str, list[ManagedRoute]] = {}
              for route in routes:
                  grouped.setdefault(route.effective_host, []).append(route)
              content: dict[str, str] = {}
              providers = self.providers.list()
              provider_by_domain = {
                  str(domain).lower().rstrip("."): provider
                  for provider in providers
                  if provider.get("type") == "netcup"
                  for domain in provider.get("domains", [])
              }
              wildcard_domains: set[str] = set()
              for host, routes in sorted(grouped.items()):
                  enabled = [route for route in routes if route.enabled]
                  catch_all = [route for route in enabled if not route.paths]
                  if len(catch_all) > 1:
                      names = ", ".join(sorted(route.name for route in catch_all))
                      raise ValueError(f"Host {host} has multiple catch-all routes: {names}.")
                  claimed_paths: dict[str, str] = {}
                  for route in enabled:
                      for path in route.paths:
                          if path in claimed_paths:
                              raise ValueError(f"Path {path} on {host} is used by both {claimed_paths[path]} and {route.name}.")
                          claimed_paths[path] = route.name
                  domains = {route.domain.lower().rstrip(".") for route in routes}
                  if len(domains) != 1:
                      raise ValueError(f"Host {host} is assigned to multiple certificate domains.")
                  modes = {route.certificate_mode for route in routes}
                  if len(modes) != 1:
                      raise ValueError(f"Host {host} uses conflicting certificate modes.")
                  routes = sorted(routes, key=lambda route: (not bool(route.paths), -max((len(path) for path in route.paths), default=0), route.name.lower()))
                  domain = next(iter(domains))
                  mode = next(iter(modes))
                  provider = provider_by_domain.get(domain)
                  tls_lines: list[str] = []
                  if provider:
                      if host == f"*.{domain}":
                          tls_lines = _netcup_tls_lines(provider)
                      elif mode == CertificateMode.INDIVIDUAL:
                          tls_lines = _netcup_tls_lines(provider, force_automate=True)
                      elif _wildcard_covers(host, domain):
                          wildcard_domains.add(domain)
                      else:
                          tls_lines = _netcup_tls_lines(provider)
                  elif mode == CertificateMode.INDIVIDUAL:
                      tls_lines = ["force_automate"]
                  digest = hashlib.sha256(host.encode("utf-8")).hexdigest()[:12]
                  content[f"site-{digest}.caddy"] = render_site(host, routes, tls_lines)
              for domain in sorted(wildcard_domains):
                  wildcard_host = f"*.{domain}"
                  if wildcard_host in grouped:
                      continue
                  digest = hashlib.sha256(wildcard_host.encode("utf-8")).hexdigest()[:12]
                  content[f"site-wildcard-{digest}.caddy"] = render_wildcard_site(
                      domain,
                      _netcup_tls_lines(provider_by_domain[domain]),
                  )
              return content
          """), "    ")
          replace("caddy_ui/caddy.py", old_rendered, new_rendered)

          replace(
              "tests/test_caddy.py",
              "from caddy_ui.domain import HeaderOperation, ManagedRoute, RouteKind, Upstream",
              "from caddy_ui.domain import CertificateMode, HeaderOperation, ManagedRoute, RouteKind, Upstream",
          )
          tests = indent(dedent("""\
          def test_netcup_provider_creates_and_reuses_wildcard_certificate(self) -> None:
              with tempfile.TemporaryDirectory() as directory:
                  config = settings(Path(directory))
                  database = Database(config)
                  database.initialize()
                  manager = TestManager(config, database, AuditLog(database))
                  manager.providers.save({"id": "netcup", "type": "netcup", "label": "Netcup", "domains": ["example.com"]})
                  manager.routes.save(self.route())
                  rendered = manager.rendered()
                  self.assertEqual(len(rendered), 2)
                  wildcard = next(value for value in rendered.values() if "*.example.com {" in value)
                  host = next(value for value in rendered.values() if "app.example.com {" in value)
                  self.assertIn("dns netcup", wildcard)
                  self.assertIn("abort", wildcard)
                  self.assertNotIn("dns netcup", host)
                  self.assertNotIn("force_automate", host)

          def test_individual_certificate_is_explicit_and_uses_netcup(self) -> None:
              with tempfile.TemporaryDirectory() as directory:
                  config = settings(Path(directory))
                  database = Database(config)
                  database.initialize()
                  manager = TestManager(config, database, AuditLog(database))
                  manager.providers.save({"id": "netcup", "type": "netcup", "label": "Netcup", "domains": ["example.com"]})
                  route = self.route()
                  route.certificate_mode = CertificateMode.INDIVIDUAL
                  manager.routes.save(route)
                  rendered = manager.rendered()
                  self.assertEqual(len(rendered), 1)
                  host = next(iter(rendered.values()))
                  self.assertIn("dns netcup", host)
                  self.assertIn("force_automate", host)
                  self.assertNotIn("*.example.com {", host)

          def test_apply_records_revision_and_rolls_back_database_and_files(self) -> None:
          """), "    ")
          replace(
              "tests/test_caddy.py",
              "    def test_apply_records_revision_and_rolls_back_database_and_files(self) -> None:\n",
              tests,
          )
      - name: Verify Python source and tests
        run: |
          python -m compileall -q caddy_ui caddy_ui_entrypoint.py scripts tests
          python -m unittest discover -v
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-wildcard-certificate-fix.yml .github/workflows/apply-wildcard-certificate-fix-v2.yml
          git add caddy_ui/domain.py caddy_ui/web.py caddy_ui/views.py caddy_ui/caddy.py tests/test_caddy.py
          git commit -m "Fix wildcard certificate management"
          git push origin HEAD:main
