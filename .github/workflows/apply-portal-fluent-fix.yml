name: Apply portal Fluent fix

on:
  push:
    branches:
      - agent/fix-portal-fluent-login

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply source changes
        run: python scripts/apply-portal-fluent-fix.py
      - name: Remove temporary automation
        run: rm .github/workflows/apply-portal-fluent-fix.yml scripts/apply-portal-fluent-fix.py
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair and style access portal"
          git push origin HEAD:agent/fix-portal-fluent-login
