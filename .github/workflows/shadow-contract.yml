name: Verify shadow deployment

on:
  push:
    branches: [main]
    paths:
      - VERSION_DOTNET
      - deploy/shadow/**
      - scripts/shadow-preflight.sh
      - tests/test_shadow_deployment.py
      - .github/workflows/shadow-contract.yml
  pull_request:
    paths:
      - VERSION_DOTNET
      - deploy/shadow/**
      - scripts/shadow-preflight.sh
      - tests/test_shadow_deployment.py
      - .github/workflows/shadow-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run shadow deployment tests
        run: python -m unittest -v tests.test_shadow_deployment
      - name: Check preflight shell syntax
        run: sh -n scripts/shadow-preflight.sh
      - name: Render Compose model with temporary read-only inputs
        run: |
          mkdir -p /tmp/caddy-ui-shadow-logs
          : > /tmp/caddy-ui-shadow-logs/access.log
          : > /tmp/caddy-ui-shadow.db
          cat > /tmp/caddy-ui-shadow.env <<'EOF'
          CADDY_UI_SHADOW_VERSION=2.0.0-beta.1
          CADDY_UI_SHADOW_BIND_ADDRESS=127.0.0.1
          CADDY_UI_SHADOW_ADMIN_PORT=18098
          CADDY_UI_SHADOW_DB_NAME=caddy_ui_shadow
          CADDY_UI_SHADOW_DB_USER=caddy_ui_shadow
          CADDY_UI_SHADOW_DB_PASSWORD=ci-postgres-password-123456789
          CADDY_UI_SHADOW_ADMIN_USERNAME=admin
          CADDY_UI_SHADOW_ADMIN_PASSWORD=ci-administrator-password-987654321
          CADDY_UI_SHADOW_LOG_DIR=/tmp/caddy-ui-shadow-logs
          CADDY_UI_SHADOW_LEGACY_SQLITE=/tmp/caddy-ui-shadow.db
          CADDY_UI_SHADOW_ACCESS_LOG=access.log
          CADDY_UI_SHADOW_MIN_HOURS=24
          CADDY_UI_SHADOW_MAX_BACKUP_AGE_HOURS=24
          CADDY_UI_SHADOW_TOLERANCE_PERCENT=5
          EOF
          docker compose \
            --env-file /tmp/caddy-ui-shadow.env \
            -f deploy/shadow/docker-compose.yml \
            config > /tmp/caddy-ui-shadow-compose.yml
          grep -F 'host_ip: 127.0.0.1' /tmp/caddy-ui-shadow-compose.yml
          grep -F 'published: "18098"' /tmp/caddy-ui-shadow-compose.yml
          grep -F 'ghcr.io/juloc/caddy-ui-dotnet-companion:2.0.0-beta.1' /tmp/caddy-ui-shadow-compose.yml
          ! grep -F '/var/run/docker.sock' /tmp/caddy-ui-shadow-compose.yml
