name: Verify Go modules

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "cmd/**"
      - "caddyguard/**"
      - "caddynetcp/**"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "cmd/**"
      - "caddyguard/**"
      - "caddynetcp/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting and modules
        shell: bash
        run: |
          gofmt -w cmd caddyguard caddynetcp
          go mod tidy
          git diff -- cmd caddyguard caddynetcp go.mod go.sum | tee /tmp/go-format.patch
          test ! -s /tmp/go-format.patch
      - name: Test
        run: |
          go test ./...
          git diff --exit-code -- go.mod go.sum
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-format-patch
          path: /tmp/go-format.patch
          retention-days: 1
